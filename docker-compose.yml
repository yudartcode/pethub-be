services:
  db:
    image: postgres:15
    container_name: pethub-db
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASS}
      POSTGRES_DB: ${DATABASE_NAME}
    ports:
      - ${DATABASE_PORT}:5432
    networks:
      - pethub
    volumes:
      - pethub_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pethub-backend
    environment:
      APP_PORT: ${APP_PORT}
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASS: ${DATABASE_PASS}
      DATABASE_NAME: ${DATABASE_NAME}
    ports:
      - '${APP_PORT}:5000'
    depends_on:
      - db
    networks:
      - pethub

networks:
  pethub:

volumes:
  pethub_data:
